site_name: Using HPC in Bioinformatics
site_url: https://hpc2n.github.io/bioinformatics-hpc
site_description: Material for Using HPC in Bioinformatics
site_dir: site.build
theme:
  name: readthedocs
  locale: en
  logo: images/logo.png
    #  static_templates:
    #- sitemap.html
  include_sidebar: true
  font:
    code: Robot Mono
  features:
    - toc.follow
    - toc.integrate
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  tabs: true
  language: en
extra_css:
  - css/extra.css
    #extra_javascript:
    #  - js/popper.min.js
    #  - js/tippy-bundle.umd.js
    #  - js/clipboard.js

nav:
  - Home: index.md
  - Programme introduction:
    - Overview: 00.programme-introduction/programme-introduction.md
  - 1. What is Bioinformatics?: 01.what-is-bioinformatics/what-is-bioinformatics.md
  - 2. Connection to a cluster (Kebnekaise):
    - Introduction: 02.connect-cluster/connect-cluster.md
    - OpenOnDemand: 02.connect-cluster/4a.OpenOnDemand/openondemand.md
    - SSH: 02.connect-cluster/4b.ssh-thinlinc/ssh.md
    - ThinLinc (optional): 02.connect-cluster/4b.ssh-thinlinc/thinlinc.md
  - 3. Introduction to computers: 
    - What is a computer?: 03.computer/computer.md
  - 4. Files and file systems:
    - Introduction: 04.files-filesystems/files-filesystems.md
    - File systems: 04.files-filesystems/filesystems.md
  - 5. Intro to compute clusters: 
    - Compute clusters: 05.compute-cluster/compute-cluster.md
  - 6. Introduction to Linux:
    - Introduction: 06.linux-intro/linux-intro.md
    - Command Line Interface (CLI): 06.linux-intro/cli.md
    - The Linux File System: 06.linux-intro/filesystem.md
    - Modifying the file tree: 06.linux-intro/modify.md
    - Editors on Linux: 06.linux-intro/editors.md
    - Data handling: 06.linux-intro/data.md
    - Pipes and filters: 06.linux-intro/pipesfilters.md
    - Finding patterns: 06.linux-intro/patterns.md
    - Awk: 06.linux-intro/awk.md 
    - Scripting: 06.linux-intro/scripting.md
    - Hints and tricks: 06.linux-intro/hints.md
    - Extra exercises: 06.linux-intro/exercises.md 
  - 7. Introduction to Git: 
    - Introduction and setup: 07.Git/intro-motivation-setup.md
    - Basic commands: 07.Git/basic-commands.md
    - Branches, merges, and conflicts: 07.Git/branches.md
    - Working with remotes: 07.Git/remotes.md
    - Teamwork: 07.Git/teamwork.md
    - Workflow for Git: 07.Git/workflow.md
    - Extra exercises: 07.Git/exercises.md
  - 8. Accessing software on Kebnekaise: 
    - Introduction: 08.software-modules-containers/introduction.md
    - What are modules?: 08.software-modules-containers/what-modules.md
    - Module system commands: 08.software-modules-containers/commands.md
    - Compiler toolchains: 08.software-modules-containers/toolchains.md
    - Software module examples: 08.software-modules-containers/programs.md
    - Modules in batch scripts: 08.software-modules-containers/batch.md
    - Containers on Kebnekaise: 08.software-modules-containers/containers-kebnekaise.md
    - Creating containers: 08.software-modules-containers/create-containers.md
    - Extra exercises: 08.software-modules-containers/exercises.md 
  - 9. Software from a Git repo: 
    - Installing from Git: 09.software-git-install-compile/git-software.md
    - Extra exercises: 09.software-git-install-compile/exercises.md
  - 10. The batch system (Slurm): 
    - Introduction: 10.batch-slurm/intro.md
    - Batch system concepts: 10.batch-slurm/concepts.md
    - Introduction to Slurm: 10.batch-slurm/slurm.md
    - Interactive jobs: 10.batch-slurm/interactive.md
    - Sample job scripts: 10.batch-slurm/jobscripts.md
    - Monitoring and efficiency: 10.batch-slurm/monitoring.md
  - Bioinformatics content:
    - Overview: bioinformatics-overview.md
    - 11. Biological Database Landscape: 11.database-landscape/database-landscape.md
    - 12. BLAST and Sequence Similarity: 12.blast/blast.md
    - 13. Bioinformatics File Formats: 13.file-formats/file-formats.md
    - 14. FAIR and Open Science:
      - Lecture: 14.fair-open-science/fair-open-science.md
      - Essay assignment: 14.fair-open-science/fair-essay-assignment.md
      - Marking rubric: 14.fair-open-science/fair-essay-marking-rubric.md
    - 15. FAIR in Practice: 15.fair-in-practice/fair-in-practice.md
    - Summary exercises: summary-exercises.md
  - Extras:
    - Install tree: tree.md
    - Linux terminology: 06.linux-intro/linux-terminology.md
    - More Linux commands: 06.linux-intro/more-commands.md
    - Linux cheat sheet: 06.linux-intro/cheat.md
    - Git setup on Kebnekaise: 07.Git/kebnekaise.md
  - Advanced/self-study: 
    - Basic commands extended: 07.Git/basic-commands-full.md
    - Basic commands exercises: 07.Git/basic-commands-full-exercises.md
    - Basic concepts extended: 07.Git/basic-concepts-full.md
    - Basic concepts exercises: 07.Git/basic-concepts-full-exercises.md
    - Traversing the commit tree extended: 07.Git/commits-full.md
    - Traversing the commit tree exercises: 07.Git/commits-full-exercises.md
    - Branches, merges, and conflicts extended: 07.Git/branches-full.md
    - Branches, merges, and conflicts exercises: 07.Git/branches-full-exercises.md
    - Working with remotes extended: 07.Git/remotes-full.md
    - Working with remotes exercises: 07.Git/remotes-full-exercises.md
    - Teamwork extended: 07.Git/teamwork-full.md
    - Teamwork exercises: 07.Git/teamwork-full-exercises.md
    - Advanced module commands: 08.software-modules-containers/advanced_module.md
    - Virtual environments and Python: 08.software-modules-containers/virtenv.md
    - Installing R packages yourself: 08.software-modules-containers/Rpack.md 
plugins:
  - search
  - external-markdown
  - mkdocstrings
  - markdown-exec
  - open-in-new-tab
  - toggle-sidebar
  - mermaid2:
      javascript: https://unpkg.com/mermaid/dist/mermaid.min.js
    #      javascript: https://unpkg.com/mermaid@10.4.0/dist/mermaid.esm.min.mjs
      arguments:
      theme: 'neutral'
            #          Theme options: default, neutral, dark, forest, base
            #themeVariables:
            #            primaryColor: '#BB2528'
             #primaryTextColor: '#fff'
            #primaryBorderColor: '#7C0000'
            #lineColor: '#F8B229'
            #secondaryColor: '#006100'
            #tertiaryColor: '#fff'
  #- markdown-footnotes

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - smarty
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
            #          format: !!python/name:pymdownx.superfences.fence_code_format
  - codehilite
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
    #  - pymdownx.blocks.tab
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      separator: "__"
